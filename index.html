<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Express</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

/* Navbar */
.navbar{
    background:#ff5722;
    color:white;
    padding:15px 30px;
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar h1{
    display:inline-block;
}

.cart{
    float:right;
    position:relative;
}

.badge{
    position:absolute;
    top:-10px;
    right:-10px;
    background:red;
    color:white;
    width:22px;
    height:22px;
    border-radius:50%;
    text-align:center;
    line-height:22px;
    font-size:12px;
}

/* Hero Section */
.hero{
    height:350px;
    background:linear-gradient(to right,#ff9800,#ff5722);
    color:white;
    text-align:center;
    padding-top:100px;
    position:relative;
    overflow:hidden;
}

.hero h2{
    font-size:40px;
}

/* Animation */
.scooter{
    position:absolute;
    bottom:20px;
    left:-150px;
    font-size:60px;
    animation:delivery 8s linear infinite;
}

@keyframes delivery{
    from{
        left:-150px;
    }
    to{
        left:100%;
    }
}

/* Button */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:white;
    color:#ff5722;
    border-radius:5px;
    text-decoration:none;
    transition:0.4s;
}

.btn:hover{
    background:black;
    color:white;
    transform:scale(1.1);
}

/* Menu */
.menu{
    padding:40px;
}

.menu h2{
    text-align:center;
    margin-bottom:20px;
}

/* Overflow */
.food-container{
    display:flex;
    gap:20px;
    overflow-x:auto;
    padding:20px;
}

.card{
    min-width:250px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    text-align:center;
    padding:15px;
    transition:0.4s;
}

.card img{
    width:100%;
    border-radius:10px;
}

.card:hover{
    transform:translateY(-10px) scale(1.05);
}

.price{
    color:#ff5722;
    font-weight:bold;
    margin-top:10px;
}

/* Offer Banner */
.offer{
    position:fixed;
    bottom:20px;
    right:20px;
    background:red;
    color:white;
    padding:15px;
    border-radius:10px;
    z-index:999;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.5;
    }
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>
</head>
<body>

<div class="navbar">
    <h1>Food Express</h1>

    <div class="cart">
        🛒 Cart
        <span class="badge">3</span>
    </div>
</div>

<div class="hero">
    <h2>Hot & Fresh Food Delivered</h2>
    <p>Order your favorite food in minutes</p>

    <a href="#" class="btn">Order Now</a>

    <div class="scooter">🛵</div>
</div>

<section class="menu">
    <h2>Popular Dishes</h2>

    <div class="food-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" alt="">
            <h3>Pizza</h3>
            <p class="price">₹299</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="">
            <h3>Burger</h3>
            <p class="price">₹199</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400" alt="">
            <h3>Pasta</h3>
            <p class="price">₹249</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1604908554027-1b0f7f17d6dd?w=400" alt="">
            <h3>Noodles</h3>
            <p class="price">₹179</p>
        </div>

    </div>
</section>

<div class="offer">
    🎉 30% OFF Today
</div>

<footer>
    © 2026 Food Express | Fast Delivery Service
</footer>

</body>
</html>
